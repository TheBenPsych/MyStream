name: MyStream build

# Builds an installable APK every time code lands on main.
# You can also start it by hand from the Actions tab ("Run workflow").
on:
  push:
    branches:
      - main
  workflow_dispatch:

defaults:
  run:
    shell: bash

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx12g -XX:MaxMetaspaceSize=1024m'"

jobs:
  build:
    runs-on: ubuntu-latest
    # A newer push cancels an older build that is still compiling (saves time).
    # Publishing is a separate job below that is never cancelled halfway.
    concurrency:
      group: ${{ github.workflow }}-build-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # Need the tags to build
      - name: Setup
        uses: ./.github/actions/setup

      # A release build is optimized (much smoother on TVs) and signed with the Benflix key
      - name: Build app
        env:
          # Numbers each build 1.0.<run number> so the app knows when an update is available
          BENFLIX_BUILD: ${{ github.run_number }}
          # The Benflix signing key, so every build can update the last one
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          # A GitHub token that can read packages, so the build includes the MPV player
          # and the AV1 / ffmpeg decoders (without them, those features are left out)
          EXTENSIONS_USERNAME: ${{ secrets.EXTENSIONS_USERNAME }}
          EXTENSIONS_PASSWORD: ${{ secrets.EXTENSIONS_PASSWORD }}
        run: |
          if [ -n "$EXTENSIONS_USERNAME" ] && [ -n "$EXTENSIONS_PASSWORD" ]; then
            echo "Building with the MPV player and extra decoders"
            export ORG_GRADLE_PROJECT_WholphinExtensionsUsername="$EXTENSIONS_USERNAME"
            export ORG_GRADLE_PROJECT_WholphinExtensionsPassword="$EXTENSIONS_PASSWORD"
          else
            echo "::warning::EXTENSIONS_USERNAME / EXTENSIONS_PASSWORD not set, building without the MPV player and extra decoders"
          fi
          ./gradlew clean assembleDefaultRelease --no-daemon

      - name: Copy APKs to short names
        run: |
          mkdir -p out
          find app/build/outputs/apk -name '*.apk' -print0 |
            while IFS= read -r -d '' apk; do
              abi="$(basename "$apk" .apk | grep -oE '(universal|armeabi-v7a|arm64-v8a|x86_64)$' || echo universal)"
              # Old name, kept so the Downloader code (2488986) keeps working
              cp "$apk" "out/MyStream-$abi.apk"
              # Names the in-app updater looks for
              if [ "$abi" = universal ]; then
                cp "$apk" "out/Benflix-release.apk"
                # The friendly name family see on the download page
                cp "$apk" "out/Benflix.apk"
              else
                cp "$apk" "out/Benflix-release-$abi.apk"
              fi
            done
          ls -l out

      - name: Upload APKs to the Actions run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Benflix-apks
          path: out/*.apk

      # Benflix: the key that turns scrambled crash reports (like "at b59.r") back into real
      # code names, so a crash can be traced to the exact line. Kept for 90 days per build.
      - name: Upload crash-report decoder (mapping.txt)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mapping
          path: app/build/outputs/mapping/**/mapping.txt
          retention-days: 90
          if-no-files-found: warn

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Never cancel a publish halfway: a cancelled publish used to leave NO release behind
    # (the old one already deleted, the new one stuck as a hidden draft), so the
    # Downloader link and the in-app updater both found nothing.
    concurrency:
      group: ${{ github.workflow }}-publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # Need the history for the "What's new" list

      - name: Get the APKs from the build
        uses: actions/download-artifact@v5
        with:
          name: Benflix-apks
          path: out

      - name: Publish to the "latest-build" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: 1.0.${{ github.run_number }}
        run: |
          # Read the build history saved in the previous release, before it is replaced
          # (if only a hidden draft is left by an old cancelled run, its text still has the history)
          # (gh api prints the error text on a 404, so only keep its output when it worked)
          if ! gh api "repos/$GITHUB_REPOSITORY/releases/tags/latest-build" --jq .body > old-notes.txt 2>/dev/null; then
            : > old-notes.txt
          fi
          if [ ! -s old-notes.txt ]; then
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '[.[] | select(.tag_name == "latest-build")][0].body // ""' > old-notes.txt 2>/dev/null || : > old-notes.txt
          fi
          prev_sha=$(grep -oE '<!-- app-sha:[0-9a-f]+ -->' old-notes.txt | head -1 | sed -E 's/.*app-sha:([0-9a-f]+).*/\1/' || true)
          if [ -z "$prev_sha" ]; then
            # Releases made before the history existed only name the commit in their text
            prev_sha=$(grep -oE '\(commit [0-9a-f]{7,}\)' old-notes.txt | head -1 | grep -oE '[0-9a-f]{7,}' || true)
          fi
          if [ -n "$prev_sha" ] && git cat-file -e "$prev_sha^{commit}" 2>/dev/null && git merge-base --is-ancestor "$prev_sha" "$GITHUB_SHA"; then
            range="$prev_sha..$GITHUB_SHA"
          else
            range="-1 $GITHUB_SHA"
          fi
          echo "Changes in this build come from: $range"

          # One friendly title per pull request that landed since the last published build
          : > new-titles.txt
          for sha in $(git rev-list --first-parent $range); do
            if [ "$(git log -1 --format=%P "$sha" | wc -w)" -gt 1 ]; then
              # "Merge pull request" commits keep the PR title on the first line of the message body
              title=$(git log -1 --format=%b "$sha" | sed '/^$/d' | head -1)
            else
              # Squash merges keep it as the subject, ending in " (#123)"
              title=$(git log -1 --format=%s "$sha" | sed -E 's/ \(#[0-9]+\)$//')
            fi
            title=$(echo "$title" | sed 's/-->//g; s/|/-/g')
            if [ -n "$title" ]; then
              echo "$title" >> new-titles.txt
            fi
          done
          [ -s new-titles.txt ] || echo "Small fixes and improvements" > new-titles.txt
          cat new-titles.txt

          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          {
            echo "Newest Benflix build (version $VERSION) from \`main\` (commit ${GITHUB_SHA::7})."
            echo
            echo "Install **Benflix.apk** on your TV or phone if you are not sure which one to pick."
            echo "<!-- app-sha:$GITHUB_SHA -->"
            # Older app versions show these lines: just this build's own changes
            while IFS= read -r t; do echo "<!-- app-note:$t -->"; done < new-titles.txt
            # Newer app versions show every build newer than the one installed, each with its date
            while IFS= read -r t; do echo "<!-- app-change:$VERSION|$now|$t -->"; done < new-titles.txt
            grep -oE '<!-- app-change:[^>]*-->' old-notes.txt | head -n 150 || true
          } > notes.txt
          cat notes.txt

          # Hidden drafts named latest-build (left by runs cancelled mid-publish) block nothing
          # but clutter the list, so remove them
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft and .tag_name == "latest-build") | .id' |
            while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"; done

          release_id=""
          if out=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/latest-build" --jq .id 2>/dev/null); then
            release_id="$out"
          fi
          if [ -z "$release_id" ]; then
            echo "No latest-build release yet, creating it"
            gh release create latest-build \
              --prerelease --latest=false \
              --title "v$VERSION" \
              --target "$GITHUB_SHA" \
              -F notes.txt \
              out/*.apk
            exit 0
          fi

          # Update the existing release IN PLACE, so the download links never disappear:
          # 1. upload each new APK under a temporary name (the old one keeps working meanwhile)
          mkdir -p next
          for f in out/*.apk; do cp "$f" "next/next-$(basename "$f")"; done
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
            --jq '.[] | select(.name | startswith("next-")) | .id' |
            while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id"; done
          gh release upload latest-build next/*.apk
          # 2. swap: remove the old APK and give the new one its real name (takes a split second)
          for f in out/*.apk; do
            name=$(basename "$f")
            old_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" --jq ".[] | select(.name == \"$name\") | .id")
            new_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" --jq ".[] | select(.name == \"next-$name\") | .id")
            [ -n "$old_id" ] && gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old_id"
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$new_id" -f name="$name" > /dev/null
          done
          # 3. point the tag at this build and update the version + "What's new" text last,
          #    so the app only sees the new version once its APK is in place
          git tag -f latest-build "$GITHUB_SHA"
          git push -f origin refs/tags/latest-build
          gh release edit latest-build --title "v$VERSION" --notes-file notes.txt --prerelease --latest=false
