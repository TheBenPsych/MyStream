name: MyStream build

# Builds an installable APK every time code lands on main.
# You can also start it by hand from the Actions tab ("Run workflow").
on:
  push:
    branches:
      - main
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx12g -XX:MaxMetaspaceSize=1024m'"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # Need the tags to build
      - name: Setup
        uses: ./.github/actions/setup

      # A release build is optimized (much smoother on TVs) and signed with the Benflix key
      - name: Build app
        env:
          # Numbers each build 1.0.<run number> so the app knows when an update is available
          BENFLIX_BUILD: ${{ github.run_number }}
          # The Benflix signing key, so every build can update the last one
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        run: ./gradlew clean assembleDefaultRelease --no-daemon

      - name: Copy APKs to short names
        run: |
          mkdir -p out
          find app/build/outputs/apk -name '*.apk' -print0 |
            while IFS= read -r -d '' apk; do
              abi="$(basename "$apk" .apk | grep -oE '(universal|armeabi-v7a|arm64-v8a|x86_64)$' || echo universal)"
              cp "$apk" "out/MyStream-$abi.apk"
              # Names the in-app updater looks for
              if [ "$abi" = universal ]; then
                cp "$apk" "out/Benflix-release.apk"
              else
                cp "$apk" "out/Benflix-release-$abi.apk"
              fi
            done
          ls -l out

      - name: Upload APKs to the Actions run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: MyStream-apks
          path: out/*.apk

      - name: Publish to the "latest-build" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest-build --cleanup-tag -y || true
          echo "Newest Benflix build (version 1.0.${{ github.run_number }}) from \`main\` (commit ${GITHUB_SHA::7}).

          Install **MyStream-universal.apk** on your TV if you are not sure which one to pick." > notes.txt
          # The app's "Update available" pop-up lists the newest changes (the titles of the last merged pull requests)
          for sha in $(git log --merges -n 8 --format=%H); do
            title=$(git log -1 --format=%b "$sha" | sed '/^$/d' | head -1 | sed 's/-->//g')
            if [ -n "$title" ]; then
              echo "<!-- app-note:$title -->" >> notes.txt
            fi
          done
          gh release create latest-build \
            --prerelease --latest=false \
            --title "v1.0.${{ github.run_number }}" \
            --target "$GITHUB_SHA" \
            -F notes.txt \
            out/*.apk
