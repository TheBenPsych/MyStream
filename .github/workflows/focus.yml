name: Benflix remote walker robot

# Walks the remote (Up, Down, Left, Right) over every TV page of THIS branch's build and lists every spot
# where the remote gets stuck (tools/audit/focus_walk.py). Uses the private test server from
# tools/audit/test_server.sh (test videos + an anime show with two seasons), so nothing on Tower is used.
# Pictures + focus.json go to the "focus-results" branch. Run by hand (Actions > Run workflow) on any branch.
on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/project-thread-rxxxp0'

concurrency:
  group: focus-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx12g -XX:MaxMetaspaceSize=1024m'"

jobs:
  tv:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # Need the tags to build
      - name: Setup
        uses: ./.github/actions/setup
      - name: Build this branch
        run: |
          ./gradlew assembleDefaultDebug --no-daemon
          cp "$(find app/build/outputs/apk -name '*x86_64*.apk' | head -1)" app.apk
          ./gradlew --stop || true
      - name: Free disk space
        run: |
          rm -rf app/build ~/.gradle/caches/build-cache-* || true
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h $HOME
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Make the private test server
        run: bash tools/audit/test_server.sh $HOME/testmedia
      - name: Set up the pretend TV
        run: |
          SDK=$ANDROID_HOME
          export PATH=$SDK/cmdline-tools/latest/bin:$SDK/emulator:$SDK/platform-tools:$PATH
          yes | sdkmanager --licenses >/dev/null || true
          img="system-images;android-36;android-tv;x86_64"
          for attempt in 1 2 3; do sdkmanager "emulator" "platform-tools" "$img" >/dev/null && break; sleep 10; done
          mkdir -p "$HOME/avd"
          echo "ANDROID_AVD_HOME=$HOME/avd" >> $GITHUB_ENV
          export ANDROID_AVD_HOME="$HOME/avd"
          echo no | avdmanager create avd -n walker -k "$img" -d tv_1080p -p "$HOME/avd/walker.avd" --force
          printf 'hw.ramSize=4096\ndisk.dataPartition.size=4G\nhw.keyboard=yes\n' >> "$HOME/avd/walker.avd/config.ini"
      - name: Walk the remote over every page
        run: |
          SDK=$ANDROID_HOME
          export PATH=$SDK/emulator:$SDK/platform-tools:$PATH
          adb kill-server || true
          [ -f ~/.android/adbkey ] || adb keygen ~/.android/adbkey
          export ADB_VENDOR_KEYS=~/.android/adbkey
          adb start-server
          booted=0
          for attempt in 1 2 3; do
            nohup emulator -avd walker -no-window -no-audio -no-boot-anim -gpu swangle_indirect -no-snapshot -wipe-data -camera-back none >> emulator.log 2>&1 &
            timeout 240 adb wait-for-device || true
            for i in $(seq 1 100); do
              if [ "$(timeout 10 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then booted=1; break; fi
              if timeout 5 adb devices | grep -q unauthorized; then adb kill-server; adb start-server; fi
              sleep 3
            done
            [ $booted = 1 ] && break
            adb emu kill || true; pkill -f qemu-system || true; sleep 5
          done
          [ $booted = 1 ] || { tail -50 emulator.log; exit 1; }
          sleep 45
          adb shell settings put global window_animation_scale 0 || true
          adb shell settings put global transition_animation_scale 0 || true
          adb shell settings put global animator_duration_scale 0 || true
          adb shell input keyevent 82 || true
          # Off holidays, so the animated decorations don't keep the screen reader from settling
          if adb root >/dev/null 2>&1; then sleep 3; adb wait-for-device; fi
          adb shell "settings put global auto_time 0; date 111012002026.00" || true
          adb shell "su 0 date 111012002026.00" || true
          timeout 300 adb install -r -g app.apk
          PKG=$(adb shell pm list packages | grep -o 'com.thebenpsych.benflix[a-z.]*' | head -1)
          echo "Package $PKG"
          set +e
          AUDIT_SERVER=http://10.0.2.2:8096 timeout 4800 python3 tools/audit/focus_walk.py tv "$PKG" results/tv
          rc=$?
          set -e
          echo "rc=$rc" > results/tv/exit.txt
          if [ $rc = 4 ]; then echo "::error::The remote gets stuck somewhere: see the list above"; exit 1; fi
          if [ $rc != 0 ]; then echo "::error::The robot stopped early (code $rc)"; exit 1; fi
      - name: Shrink pictures
        if: always()
        run: |
          pip install pillow >/dev/null
          python3 - <<'PY'
          import glob, os
          from PIL import Image
          for p in glob.glob("results/*/*.png"):
              try:
                  im = Image.open(p).convert("RGB")
                  im.thumbnail((1280, 1280))
                  im.save(p[:-4] + ".jpg", quality=72)
              except Exception as e:
                  print(p, e)
              os.remove(p)
          PY
      - name: Save results to the focus-results branch
        if: always()
        run: |
          mkdir -p results
          cd results
          git init -q -b focus-results
          git config user.name "remote walker robot"
          git config user.email "audit@users.noreply.github.com"
          echo "Run ${{ github.run_id }} on ${{ github.sha }}" > RUN.txt
          git add -A
          git commit -qm "Focus walk ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" focus-results
    permissions:
      contents: write
