name: Glowfin normal-person robot

# Walks the everyday trips a person makes (Home -> a door -> a movie -> Play -> Back, a show, Search, the
# other doors, profile menu, Settings) on a pretend TV (remote only), a pretend phone (finger only) and the
# web version (computer and phone size), and takes a picture of every step. Pictures + notes go to the
# "journey-results" branch so they can be looked through in order. Run by hand (Actions > Run workflow).
on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/project-thread-q7wn9c'
    paths:
      - 'tools/audit/journeys*'
      - '.github/workflows/journeys.yml'

concurrency:
  group: journeys-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        mode: [tv, phone]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download the newest published build
        run: curl -fsSL -o app.apk https://github.com/${{ github.repository }}/releases/download/latest-build/MyStream-x86_64.apk
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/lib/node_modules || true
          df -h $HOME
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Set up the emulator
        run: |
          SDK=$ANDROID_HOME
          export PATH=$SDK/cmdline-tools/latest/bin:$SDK/emulator:$SDK/platform-tools:$PATH
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --list 2>/dev/null | grep -E "system-images;android-3[0-9];(android-tv|google-tv|google_apis);x86" | awk '{print $1}' | sort -u > images.txt
          cat images.txt
          if [ "${{ matrix.mode }}" = tv ]; then
            want="android-36;android-tv;x86_64 android-36;google-tv;x86_64"
            device=tv_1080p
          else
            want="android-34;google_apis;x86_64 android-33;google_apis;x86_64"
            device=pixel_6
          fi
          img=""
          for w in $want; do if grep -qx "system-images;$w" images.txt; then img="system-images;$w"; break; fi; done
          echo "Using $img"
          echo "IMG=$img" >> $GITHUB_ENV
          sdkmanager "emulator" "platform-tools" "$img" >/dev/null
          mkdir -p "$HOME/avd"
          echo "ANDROID_AVD_HOME=$HOME/avd" >> $GITHUB_ENV
          export ANDROID_AVD_HOME="$HOME/avd"
          echo no | avdmanager create avd -n audit -k "$img" -d $device -p "$HOME/avd/audit.avd" --force
          printf 'hw.ramSize=4096\ndisk.dataPartition.size=4G\nhw.keyboard=yes\n' >> "$HOME/avd/audit.avd/config.ini"
          ls "$HOME/avd"
      - name: Run the robot
        run: |
          SDK=$ANDROID_HOME
          export PATH=$SDK/emulator:$SDK/platform-tools:$PATH
          # adb keys first, so the emulator trusts this computer (otherwise "device unauthorized")
          adb kill-server || true
          mkdir -p ~/.android
          [ -f ~/.android/adbkey ] || adb keygen ~/.android/adbkey
          export ADB_VENDOR_KEYS=~/.android/adbkey
          adb start-server
          GPU=swiftshader_indirect
          [ "${{ matrix.mode }}" = tv ] && GPU=swangle_indirect
          boot() {
            booted=0
            for attempt in 1 2 3; do
              nohup emulator -avd audit -no-window -no-audio -no-boot-anim -gpu $GPU -no-snapshot $1 -camera-back none >> emulator.log 2>&1 &
              timeout 240 adb wait-for-device || true
              for i in $(seq 1 100); do
                if [ "$(timeout 10 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then booted=1; break; fi
                if timeout 5 adb devices | grep -q unauthorized; then adb kill-server; adb start-server; fi
                sleep 3
              done
              [ $booted = 1 ] && break
              echo "Emulator did not boot (attempt $attempt), retrying"
              adb emu kill || true; pkill -f qemu-system || true; sleep 5
            done
            [ $booted = 1 ] || { tail -50 emulator.log; exit 1; }
            # let the home screen settle so it doesn't show "isn't responding"
            sleep 45
            timeout 120 adb wait-for-device || true
            adb shell settings put global window_animation_scale 0 || true
            adb shell settings put global transition_animation_scale 0 || true
            adb shell settings put global animator_duration_scale 0 || true
            adb shell input keyevent 82 || true
            # Move the clock off holidays so the robot sees the everyday screens (the animated holiday
            # scene keeps the screen reader from ever settling on the TV emulator)
            if adb root >/dev/null 2>&1; then sleep 3; adb wait-for-device; fi
            adb shell getprop ro.build.type || true
            adb shell "settings put global auto_time 0; date 111012002026.00" || true
            adb shell "su 0 date 111012002026.00" || adb shell "su root date 111012002026.00" || true
            adb shell date || true
            timeout 300 adb install -r -g app.apk
          }
          boot -wipe-data
          PKG=$(adb shell pm list packages | grep -o 'com.thebenpsych.benflix[a-z.]*' | head -1)
          echo "Package $PKG"
          adb shell getprop ro.product.cpu.abilist
          for run in 1 2; do
            timeout 3000 python3 tools/audit/journeys.py ${{ matrix.mode }} "$PKG" results/${{ matrix.mode }} && break
            if timeout 10 adb shell true 2>/dev/null; then break; fi
            echo "Emulator gone, starting it again"
            pkill -f qemu-system || true; sleep 5
            boot ""
          done
      - name: Shrink pictures
        if: always()
        run: |
          pip install pillow >/dev/null
          python3 - <<'PY'
          import glob, os
          from PIL import Image
          for p in glob.glob("results/*/*.png"):
              try:
                  im = Image.open(p).convert("RGB")
                  im.thumbnail((1280, 1280))
                  im.save(p[:-4] + ".jpg", quality=72)
              except Exception as e:
                  print(p, e)
              os.remove(p)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: journeys-${{ matrix.mode }}
          path: results

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Start the Benflix helper (web version) against the Jellyfin demo server
        run: |
          cp -r server /tmp/srv
          sed -i 's#^RAW = .*#RAW = "http://127.0.0.1:1/none"#' /tmp/srv/benflix_web.py
          cd /tmp/srv
          JELLYFIN_URL=https://demo.jellyfin.org/stable PORT=8097 nohup python3 benflix-games-helper.py > /tmp/helper.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8097/ >/dev/null && break; sleep 1; done
      - name: Walk the web version
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.49.1 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          cd "$GITHUB_WORKSPACE"
          NODE_PATH=/tmp/pw/node_modules timeout 1800 node tools/audit/journeys_web.js http://127.0.0.1:8097/ results/web || echo "web robot stopped with $?"
          cp /tmp/helper.log results/web/ || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: journeys-web
          path: results

  publish:
    needs: [android, web]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: journeys-*
          merge-multiple: true
          path: results
      - name: Save results to the journey-results branch
        run: |
          mkdir -p results
          cd results
          git init -q -b journey-results
          git config user.name "journey robot"
          git config user.email "audit@users.noreply.github.com"
          echo "Run ${{ github.run_id }} on ${{ github.sha }}" > RUN.txt
          git add -A
          git commit -qm "Journey run ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" journey-results
