name: Benflix fit robot

# Draws title pages with long, awkward names (long English titles, Japanese original names, lots of tabs)
# at TV size and phone size, takes a picture of each, and flags text that is cut off, spills out of its
# space, or is drawn on top of other text (Ben 2026-11-18: "Various text cut off, send bots to check for
# more"). No emulator: the pages are drawn by Robolectric, so it takes a few minutes. Pictures (problems
# boxed in red) and report.md go to the "fit-results" branch. Run by hand (Actions > Run workflow).
on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/project-thread-8exqpr'

concurrency:
  group: fit-robot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx12g -XX:MaxMetaspaceSize=1024m'"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Setup
        uses: ./.github/actions/setup
      - name: Run the fit robot
        run: |
          # One more try when the first one fails (downloading Gradle plugins sometimes fails on GitHub)
          for attempt in 1 2; do
            rm -rf app/build/fit-robot
            if ./gradlew testDefaultDebugUnitTest --tests '*FitRobotTest*' -PbenflixFit=1 --no-daemon --continue; then
              echo "ROBOT_FAILED=0" >> $GITHUB_ENV; break
            fi
            echo "ROBOT_FAILED=1" >> $GITHUB_ENV
            sleep 20
          done
      - name: Save results to the fit-results branch
        if: ${{ !cancelled() }}
        run: |
          mkdir -p results
          cp -r app/build/fit-robot/. results/ 2>/dev/null || true
          mkdir -p results/test-reports
          cp -r app/build/test-results/testDefaultDebugUnitTest/*Fit* results/test-reports/ 2>/dev/null || true
          cd results
          git init -q -b fit-results
          git config user.name "fit robot"
          git config user.email "audit@users.noreply.github.com"
          echo "Run ${{ github.run_id }} on ${{ github.sha }} (robot failed: ${ROBOT_FAILED:-0})" > RUN.txt
          git add -A
          git commit -qm "Fit run ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" fit-results
      - name: Fail if the robot itself broke
        if: env.ROBOT_FAILED == '1'
        run: exit 1
