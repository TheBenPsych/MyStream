name: PR

on:
  pull_request:
    # labeled: adding the old-android label re-runs the checks with the Android 6 and 7 robots too
    types: [opened, synchronize, reopened, labeled]

defaults:
  run:
    shell: bash

env:
  BUILD_DIRS_ARTIFACT: build-dirs
  GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx12g -XX:MaxMetaspaceSize=1024m'"

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout the code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0 # Need the tags to build
    - name: Setup Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: '3.14'
    - name: Run pre-commit
      uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  build:
    runs-on: ubuntu-latest
    needs: pre-commit
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # Need the tags to build
      - name: Setup
        uses: ./.github/actions/setup
      - name: Build app
        id: buildapp
        run: |
          ./gradlew clean assembleDefaultDebug testDefaultDebugUnitTest --no-daemon
          apks=$(find app/build/outputs \( -name '*.apk' -or -name '*.aab' \) -print0 | tr '\0' ',' | sed 's/,$//')
          echo "apks=$apks" >> "$GITHUB_OUTPUT"
          cp "$(find app/build/outputs/apk -name '*x86_64*.apk' | head -1)" robot-app.apk
      - name: Keep the app for the test robot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: robot-apk
          path: robot-app.apk
          retention-days: 3

  # Benflix speed + safety: the test robot opens this build on a pretend TV and a pretend phone, signs in
  # to the public Jellyfin demo server, opens every tab, a details page and the player, and fails the
  # check if the app crashes. (The full robot with the button sweep runs after each update on main.)
  robot-check:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # tv = Android 16 TV, phone = Android 14 phone. The old phones catch
        # crashes from features that only exist on newer Android, like the Night mode crash on an
        # Android 7 Fire TV Stick (Nov 2026). Old TV pretend devices only come in 32-bit, so old
        # phones stand in for old TVs: the same app code runs on both.
        # Fire TV versions: Fire OS 6 = Android 7 (Fire TV Stick 4K 2018), Fire OS 7 = Android 9
        # (Stick 3rd gen / Lite / 4K Max), Fire OS 8 = Android 11. Android 6 is the oldest Benflix installs on.
        # Android 6 and 7 robots are slow (often hit the 40 minute limit), so they only run when the PR
        # has the old-android label. android-check (lint) still checks old-Android crashes on every PR.
        mode: ${{ fromJSON(contains(github.event.pull_request.labels.*.name, 'old-android') && '["tv","phone","phone-android6","phone-android7","phone-android9","phone-android11"]' || '["tv","phone","phone-android9","phone-android11"]') }}
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@v5
        with:
          name: robot-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Set up the emulator
        run: |
          SDK=$ANDROID_HOME
          export PATH=$SDK/cmdline-tools/latest/bin:$SDK/emulator:$SDK/platform-tools:$PATH
          yes | sdkmanager --licenses >/dev/null || true
          case "${{ matrix.mode }}" in
            tv) img="system-images;android-36;android-tv;x86_64"; device=tv_1080p ;;
            phone-android6) img="system-images;android-23;google_apis;x86_64"; device=pixel ;;
            phone-android7) img="system-images;android-25;google_apis;x86_64"; device=pixel ;;
            phone-android9) img="system-images;android-28;google_apis;x86_64"; device=pixel ;;
            phone-android11) img="system-images;android-30;google_apis;x86_64"; device=pixel ;;
            *) img="system-images;android-34;google_apis;x86_64"; device=pixel_6 ;;
          esac
          # GitHub's download of the emulator sometimes comes back broken: try again, then skip (not an app problem)
          ok=0
          for attempt in 1 2 3; do
            if sdkmanager "emulator" "platform-tools" "$img" >/dev/null; then ok=1; break; fi
            echo "Emulator download failed (attempt $attempt), retrying"; sleep 10
          done
          if [ $ok != 1 ]; then
            echo "::warning::GitHub couldn't download the pretend ${{ matrix.mode }}, so the robot check was skipped (not an app problem)."
            echo "ROBOT_SKIP=1" >> $GITHUB_ENV
            exit 0
          fi
          mkdir -p "$HOME/avd"
          echo "ANDROID_AVD_HOME=$HOME/avd" >> $GITHUB_ENV
          export ANDROID_AVD_HOME="$HOME/avd"
          echo no | avdmanager create avd -n robot -k "$img" -d $device -p "$HOME/avd/robot.avd" --force
          printf 'hw.ramSize=4096\ndisk.dataPartition.size=4G\nhw.keyboard=yes\n' >> "$HOME/avd/robot.avd/config.ini"
      - name: Run the quick robot check
        if: env.ROBOT_SKIP != '1'
        run: |
          SDK=$ANDROID_HOME
          export PATH=$SDK/emulator:$SDK/platform-tools:$PATH
          adb kill-server || true
          [ -f ~/.android/adbkey ] || adb keygen ~/.android/adbkey
          export ADB_VENDOR_KEYS=~/.android/adbkey
          adb start-server
          GPU=swiftshader_indirect
          [ "${{ matrix.mode }}" = tv ] && GPU=swangle_indirect
          booted=0
          for attempt in 1 2 3; do
            nohup emulator -avd robot -no-window -no-audio -no-boot-anim -gpu $GPU -no-snapshot -wipe-data -camera-back none >> emulator.log 2>&1 &
            timeout 240 adb wait-for-device || true
            for i in $(seq 1 100); do
              if [ "$(timeout 10 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then booted=1; break; fi
              if timeout 5 adb devices | grep -q unauthorized; then adb kill-server; adb start-server; fi
              sleep 3
            done
            [ $booted = 1 ] && break
            echo "Emulator did not boot (attempt $attempt), retrying"
            adb emu kill || true; pkill -f qemu-system || true; sleep 5
          done
          if [ $booted != 1 ]; then
            echo "::warning::The pretend ${{ matrix.mode }} would not start on GitHub's computer, so the robot check was skipped (not an app problem)."
            exit 0
          fi
          sleep 45
          adb shell settings put global window_animation_scale 0 || true
          adb shell settings put global transition_animation_scale 0 || true
          adb shell settings put global animator_duration_scale 0 || true
          adb shell input keyevent 82 || true
          timeout 300 adb install -r -g robot-app.apk
          PKG=$(adb shell pm list packages | grep -o 'com.thebenpsych.benflix[a-z.]*' | head -1)
          echo "Package $PKG"
          set +e
          DRIVE_MODE=phone
          [ "${{ matrix.mode }}" = tv ] && DRIVE_MODE=tv
          SMOKE=1 timeout 1200 python3 tools/audit/drive.py $DRIVE_MODE "$PKG" results/${{ matrix.mode }}
          rc=$?
          set -e
          if [ $rc = 3 ]; then
            echo "::error::Benflix crashed on the pretend ${{ matrix.mode }}. The crash is printed above."
            exit 1
          fi
          if [ $rc != 0 ]; then
            echo "::warning::The robot stopped early (code $rc) without seeing a crash, for example the demo server was slow."
          fi
      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: robot-check-${{ matrix.mode }}
          path: results
          if-no-files-found: ignore
          retention-days: 7

  # Android's own checker. It looks for code that would crash on older Android
  # versions (Android 9 TVs, Android 11 TVs) and other common mistakes.
  # It only reports for now, so old warnings don't block a build.
  android-check:
    runs-on: ubuntu-latest
    needs: pre-commit
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Setup
        uses: ./.github/actions/setup
      - name: Run Android checks
        run: ./gradlew lintDefaultDebug --continue --no-daemon || true
      - name: Show problems that can crash older Android
        run: python3 tools/lint_summary.py app/build/reports/lint-results-defaultDebug.xml
      - name: Look for newer Android features used without a version check
        if: always()
        run: python3 tools/old_android_check.py app/src/main/java
      - name: Upload full report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-check-report
          path: app/build/reports/lint-results-defaultDebug.*
