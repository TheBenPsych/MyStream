name: PR

on:
  pull_request:

defaults:
  run:
    shell: bash

env:
  BUILD_DIRS_ARTIFACT: build-dirs
  GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx12g -XX:MaxMetaspaceSize=1024m'"

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout the code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0 # Need the tags to build
    - name: Setup Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: '3.14'
    - name: Run pre-commit
      uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  build:
    runs-on: ubuntu-latest
    needs: pre-commit
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # Need the tags to build
      - name: Setup
        uses: ./.github/actions/setup
      - name: Build app
        id: buildapp
        run: |
          ./gradlew clean assembleDefaultDebug testDefaultDebugUnitTest --no-daemon
          apks=$(find app/build/outputs \( -name '*.apk' -or -name '*.aab' \) -print0 | tr '\0' ',' | sed 's/,$//')
          echo "apks=$apks" >> "$GITHUB_OUTPUT"

  # Android's own checker. It looks for code that would crash on older Android
  # versions (Android 9 TVs, Android 11 TVs) and other common mistakes.
  # It only reports for now, so old warnings don't block a build.
  android-check:
    runs-on: ubuntu-latest
    needs: pre-commit
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Setup
        uses: ./.github/actions/setup
      - name: Run Android checks
        run: ./gradlew lintDefaultDebug --continue --no-daemon || true
      - name: Show problems that can crash older Android
        run: python3 tools/lint_summary.py app/build/reports/lint-results-defaultDebug.xml
      - name: Upload full report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-check-report
          path: app/build/reports/lint-results-defaultDebug.*
