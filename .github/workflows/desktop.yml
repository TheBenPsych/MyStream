name: Glowfin for computers

# Builds the Glowfin app for Linux (also Steam Deck) and Windows whenever the desktop folder changes on main,
# and puts the downloads on the "desktop-latest" release. Installed apps look there to update themselves.
# On a pull request it only checks that the app still builds. You can also start it by hand from the
# Actions tab ("Run workflow").
on:
  push:
    branches:
      - main
    paths:
      - desktop/**
      - .github/workflows/desktop.yml
  pull_request:
    paths:
      - desktop/**
      - .github/workflows/desktop.yml
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            script: dist:linux
          - os: windows-latest
            name: windows
            script: dist:win
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-build-${{ matrix.name }}-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install what the app is built from
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: Quick checks
        working-directory: desktop
        run: npm run check
      # Numbers each build 1.0.<run number> so an installed app knows when a newer one is out
      - name: Build the download
        working-directory: desktop
        run: |
          npm version "1.0.${{ github.run_number }}" --no-git-tag-version --allow-same-version
          npm run ${{ matrix.script }}
          mkdir -p ../out
          cp dist/Glowfin-* dist/latest*.yml ../out/
          ls -la ../out
      - name: Keep the download for the publish step
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-${{ matrix.name }}
          path: out/
          retention-days: 3

  publish:
    needs: build
    # Publishes whatever built, so a hiccup in the Windows build never holds back the Linux one
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Never cancel a publish halfway, and only one at a time
    concurrency:
      group: ${{ github.workflow }}-publish
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: desktop-*
          path: out
          merge-multiple: true
      - name: Publish to the "desktop-latest" release
        run: |
          ls -la out
          cat > notes.txt <<NOTES
          Glowfin for computers, build $VERSION.

          - **Linux and Steam Deck:** Glowfin-linux.AppImage (runs on nearly every Linux)
          - **Ubuntu, Mint, Debian:** Glowfin-linux.deb
          - **Windows:** Glowfin-win.exe

          An installed Glowfin updates itself from here. Everything inside the app comes from your own server.
          NOTES
          if ! gh api "repos/$GITHUB_REPOSITORY/releases/tags/desktop-latest" --jq .id > /dev/null 2>&1; then
            echo "No desktop-latest release yet, creating it"
            gh release create desktop-latest --repo "$GITHUB_REPOSITORY" --prerelease --latest=false \
              --title "Glowfin for computers $VERSION" --target "$GITHUB_SHA" -F notes.txt
          fi
          # The big files first, then the small "what's the newest" files last, so an installed app only
          # hears about the new build once its download is really there
          gh release upload desktop-latest --repo "$GITHUB_REPOSITORY" --clobber out/Glowfin-*
          gh release upload desktop-latest --repo "$GITHUB_REPOSITORY" --clobber out/latest*.yml
          gh release edit desktop-latest --repo "$GITHUB_REPOSITORY" --title "Glowfin for computers $VERSION" \
            --notes-file notes.txt --prerelease --latest=false
