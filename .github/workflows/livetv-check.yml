name: Live TV deep check

# Run by hand (Actions > Live TV deep check > Run workflow): builds the channel list and plays every channel
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build the list and play every channel through Tower's address
        run: python3 server/tools/livetv_pipeline_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: livetv-report
          path: /tmp/benflix-livetv/status.json
