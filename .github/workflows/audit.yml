name: Benflix audit (emulator robot)

# Runs Benflix on an Android TV emulator and a phone emulator, signs in to the public Jellyfin demo
# server, visits every screen, checks every button can be reached with the remote, times loading,
# and does a random stress test to find crashes. Screenshots and the report go to the "audit-results" branch.
on:
  workflow_dispatch:
    inputs:
      apk:
        description: "Which app to test: 'latest' (the newest published build) or 'branch' (build this branch)"
        default: latest
  push:
    branches:
      - 'claude/project-thread-bhgjhc'
    paths:
      - 'tools/audit/**'
      - '.github/workflows/audit.yml'

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx12g -XX:MaxMetaspaceSize=1024m'"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Decide
        id: decide
        run: |
          src="${{ github.event.inputs.apk }}"
          if [ -z "$src" ]; then src=$(cat tools/audit/APK_SOURCE 2>/dev/null || echo latest); fi
          echo "src=$src" >> "$GITHUB_OUTPUT"
          echo "Testing: $src"
      - name: Setup
        if: steps.decide.outputs.src == 'branch'
        uses: ./.github/actions/setup
      - name: Build this branch
        if: steps.decide.outputs.src == 'branch'
        env:
          BENFLIX_BUILD: 99999  # newer than any real build, so the update pop-up stays away
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          EXTENSIONS_USERNAME: ${{ secrets.EXTENSIONS_USERNAME }}
          EXTENSIONS_PASSWORD: ${{ secrets.EXTENSIONS_PASSWORD }}
        run: |
          if [ -n "$EXTENSIONS_USERNAME" ]; then
            export ORG_GRADLE_PROJECT_WholphinExtensionsUsername="$EXTENSIONS_USERNAME"
            export ORG_GRADLE_PROJECT_WholphinExtensionsPassword="$EXTENSIONS_PASSWORD"
          fi
          ./gradlew assembleDefaultRelease --no-daemon
          cp "$(find app/build/outputs/apk -name '*x86_64*.apk' | head -1)" app.apk
      - name: Download the newest published build
        if: steps.decide.outputs.src != 'branch'
        run: curl -fsSL -o app.apk https://github.com/${{ github.repository }}/releases/download/latest-build/MyStream-x86_64.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: apk
          path: app.apk

  robot:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        mode: [tv, phone]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@v5
        with:
          name: apk
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/lib/node_modules || true
          df -h $HOME
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Set up the emulator
        run: |
          SDK=$ANDROID_HOME
          export PATH=$SDK/cmdline-tools/latest/bin:$SDK/emulator:$SDK/platform-tools:$PATH
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --list 2>/dev/null | grep -E "system-images;android-3[0-9];(android-tv|google-tv|google_apis);x86" | awk '{print $1}' | sort -u > images.txt
          cat images.txt
          if [ "${{ matrix.mode }}" = tv ]; then
            want="android-36;android-tv;x86_64 android-36;google-tv;x86_64"
            device=tv_1080p
          else
            want="android-34;google_apis;x86_64 android-33;google_apis;x86_64"
            device=pixel_6
          fi
          img=""
          for w in $want; do if grep -qx "system-images;$w" images.txt; then img="system-images;$w"; break; fi; done
          echo "Using $img"
          echo "IMG=$img" >> $GITHUB_ENV
          sdkmanager "emulator" "platform-tools" "$img" >/dev/null
          mkdir -p "$HOME/avd"
          echo "ANDROID_AVD_HOME=$HOME/avd" >> $GITHUB_ENV
          export ANDROID_AVD_HOME="$HOME/avd"
          echo no | avdmanager create avd -n audit -k "$img" -d $device -p "$HOME/avd/audit.avd" --force
          printf 'hw.ramSize=4096\ndisk.dataPartition.size=4G\nhw.keyboard=yes\n' >> "$HOME/avd/audit.avd/config.ini"
          ls "$HOME/avd"
      - name: Run the robot
        run: |
          SDK=$ANDROID_HOME
          export PATH=$SDK/emulator:$SDK/platform-tools:$PATH
          # adb keys first, so the emulator trusts this computer (otherwise "device unauthorized")
          adb kill-server || true
          [ -f ~/.android/adbkey ] || adb keygen ~/.android/adbkey
          export ADB_VENDOR_KEYS=~/.android/adbkey
          adb start-server
          GPU=swiftshader_indirect
          [ "${{ matrix.mode }}" = tv ] && GPU=swangle_indirect
          boot() {
            booted=0
            for attempt in 1 2 3; do
              nohup emulator -avd audit -no-window -no-audio -no-boot-anim -gpu $GPU -no-snapshot $1 -camera-back none >> emulator.log 2>&1 &
              timeout 240 adb wait-for-device || true
              for i in $(seq 1 100); do
                if [ "$(timeout 10 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then booted=1; break; fi
                if timeout 5 adb devices | grep -q unauthorized; then adb kill-server; adb start-server; fi
                sleep 3
              done
              [ $booted = 1 ] && break
              echo "Emulator did not boot (attempt $attempt), retrying"
              adb emu kill || true; pkill -f qemu-system || true; sleep 5
            done
            [ $booted = 1 ] || { tail -50 emulator.log; exit 1; }
            # let the home screen settle so it doesn't show "isn't responding"
            sleep 45
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            adb shell input keyevent 82 || true
            # Move the clock off holidays so the robot sees the everyday screens (the animated holiday
            # scene keeps the screen reader from ever settling on the TV emulator)
            if adb root >/dev/null 2>&1; then sleep 3; adb wait-for-device; fi
            adb shell "settings put global auto_time 0; date 111012002026.00" || true
            adb shell date || true
            timeout 300 adb install -r -g app.apk
          }
          boot -wipe-data
          PKG=$(adb shell pm list packages | grep -o 'com.thebenpsych.benflix[a-z.]*' | head -1)
          echo "Package $PKG"
          adb shell getprop ro.product.cpu.abilist
          # The emulator itself sometimes crashes on these cloud computers; if so, start it again and carry on
          for run in 1 2 3; do
            timeout 2700 python3 tools/audit/drive.py ${{ matrix.mode }} "$PKG" results/${{ matrix.mode }} && break
            echo "robot exited with $? (run $run)"
            if timeout 10 adb shell true 2>/dev/null; then break; fi
            echo "Emulator gone, starting it again"
            pkill -f qemu-system || true; sleep 5
            boot ""
          done
          adb shell dumpsys meminfo "$PKG" > results/${{ matrix.mode }}/meminfo.txt || true
          adb shell dumpsys gfxinfo "$PKG" > results/${{ matrix.mode }}/gfxinfo.txt || true
          cp emulator.log results/${{ matrix.mode }}/ || true
          echo "$IMG" > results/${{ matrix.mode }}/image.txt
      - name: Shrink screenshots
        run: |
          pip install pillow >/dev/null
          python3 - <<'PY'
          import glob, os
          from PIL import Image
          for p in glob.glob("results/*/*.png"):
              try:
                  im = Image.open(p).convert("RGB")
                  im.thumbnail((960, 960))
                  im.save(p[:-4] + ".jpg", quality=70)
              except Exception as e:
                  print(p, e)
              os.remove(p)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: results-${{ matrix.mode }}
          path: results

  publish:
    needs: robot
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: results-*
          merge-multiple: true
          path: results
      - name: Save results to the audit-results branch
        run: |
          mkdir -p results
          cd results
          git init -q -b audit-results
          git config user.name "audit robot"
          git config user.email "audit@users.noreply.github.com"
          echo "Run ${{ github.run_id }} on ${{ github.sha }}" > RUN.txt
          git add -A
          git commit -qm "Audit run ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" audit-results
