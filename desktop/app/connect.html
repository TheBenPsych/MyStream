<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'self'">
<title>Glowfin</title>
<!-- Glowfin desktop: the screen that finds Tower. Shown the first time, and whenever Tower can't be reached.
     Works with a mouse, a keyboard or a controller (stick or D-pad moves, A picks). -->
<style>
  :root { --tray: #0B0D1A; --pg3: #1A1E38; --line: #262A45; --ink: #ECEEFB; --ink2: #9AA0C3; --aqua: #3FE0E8; color-scheme: dark; }
  @font-face { font-family: "Glowfin Lexend"; src: url("fonts/glowfin_lexend_light.ttf"); font-weight: 300; }
  @font-face { font-family: "Glowfin Lexend"; src: url("fonts/glowfin_lexend_regular.ttf"); font-weight: 400 500; }
  @font-face { font-family: "Glowfin Lexend"; src: url("fonts/glowfin_lexend_semibold.ttf"); font-weight: 600 900; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--tray); color: var(--ink); font: 18px/1.45 "Glowfin Lexend", "Segoe UI Variable", system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: grid; place-items: center; padding: 24px; }
  main { width: min(560px, 100%); text-align: center; }
  img { width: 96px; height: 92px; margin: 0 auto 8px; display: block; }
  h1 { font-size: 34px; font-weight: 300; margin: 0 0 6px; }
  h1 b { font-weight: 600; background: linear-gradient(100deg, #A55BE0, #1FA8E6 60%, #3FE0E8); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #say { font-size: 22px; font-weight: 600; margin: 22px 0 6px; }
  #more { color: var(--ink2); margin: 0 0 22px; min-height: 1.45em; }
  .hidden { display: none !important; }
  label { display: block; text-align: left; color: var(--ink2); font-size: 15px; margin: 0 0 6px 4px; }
  input { width: 100%; font: inherit; color: inherit; background: var(--pg3); border: 2px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .row { display: flex; gap: 12px; margin-top: 14px; flex-wrap: wrap; }
  button { flex: 1 1 160px; font: inherit; font-weight: 600; color: var(--ink); background: var(--pg3); border: 2px solid var(--line); border-radius: 12px; padding: 14px 18px; cursor: pointer; }
  button.main { background: var(--ink); color: #0B0D1A; border-color: var(--ink); }
  button:disabled { opacity: .5; cursor: default; }
  :focus { outline: none; }
  input:focus, button:focus { border-color: var(--aqua); box-shadow: 0 0 0 4px rgba(63, 224, 232, .35); }
  #bad { color: #FF7A7A; min-height: 1.45em; margin: 14px 0 0; }
  .dots::after { content: ""; animation: dots 1.4s steps(4, end) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
  footer { color: var(--ink2); font-size: 14px; margin-top: 26px; }
</style>
</head>
<body>
<main>
  <img src="glowfin-mark.svg" alt="">
  <h1>Glow<b>fin</b></h1>
  <p id="say"></p>
  <p id="more"></p>
  <div id="form" class="hidden">
    <label for="addr">Tower's address</label>
    <input id="addr" inputmode="url" autocomplete="off" spellcheck="false" placeholder="Like 192.168.1.105">
    <div class="row">
      <button id="go" class="main">Connect</button>
      <button id="find">Look for Tower</button>
      <button id="again" class="hidden">Try again</button>
      <button id="dl" class="hidden">Watch your downloads</button>
    </div>
    <p id="bad"></p>
  </div>
  <footer id="foot"></footer>
</main>
<script src="connect.js"></script>
</body>
</html>
