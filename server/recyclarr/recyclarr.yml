# Benflix: Recyclarr settings for Ben's Sonarr and Radarr (Recyclarr 8).
# Keeps the existing profile names and scores, and fixes these:
#  - Audio: only English or the show's own original language. Releases with an extra dub (ITA-ENG, MULTi)
#    or only a foreign dub are blocked (Benflix's own formats, in custom-formats/)
#  - Sonarr LQ and LQ (Release Title) are -10000 (they were +100 in places)
#  - min score is 0, so ordinary releases are no longer skipped
#  - Radarr: YTS is kept but scores 0, so it is only grabbed when no better release exists
#    (the full LQ list is not used because it blocks YTS; LQ (Release Title) is used instead)
#  - Radarr: BR-DISK, 3D, Extras, Upscaled, Bad Dual Groups, Obfuscated, Retags, Scene blocked
# Keys and addresses live in secrets.yml next to this file, on Tower only.
sonarr:
  sonarr-main:
    base_url: !secret sonarr_url
    api_key: !secret sonarr_key
    delete_old_custom_formats: false
    quality_profiles:
      - name: HD - 720p/1080p
        reset_unmatched_scores:
          enabled: false
        upgrade:
          allowed: true
          until_score: 10000
        min_format_score: 0
      - name: Anime HD - 720p/1080p
        reset_unmatched_scores:
