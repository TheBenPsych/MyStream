<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0D1A">
<title>Harbor Lounge</title>
<!--
  The Harbor Lounge, a place in the Lobby (js/lounge.js draws it). The Lobby page (js/lobby.js) shows this
  page in a frame when the host picks "Harbor Lounge", and talks to it through GF_LOUNGE (this page) and GF_LOUNGE_HOST (the Lobby page).
  Opened by itself (web/lounge.html) it still works as a walk-around with nobody else in it.
-->
<style>
  @font-face { font-family: "Glowfin Lexend"; font-weight: 400 500; src: url("fonts/glowfin_lexend_regular.ttf"); }
  @font-face { font-family: "Glowfin Lexend"; font-weight: 600; src: url("fonts/glowfin_lexend_semibold.ttf"); }
  @font-face { font-family: "Glowfin Lexend"; font-weight: 700 900; src: url("fonts/glowfin_lexend_bold.ttf"); }
  :root { --line: #2A2F52; --ink: #ECEEFB; --ink2: #A3A9CC; --aqua: #3FE0E8; --raise2: #222645; --body: "Glowfin Lexend", system-ui, sans-serif;
    --glow: linear-gradient(135deg, #A55BE0, #1FA8E6 60%, #3FE0E8); }
  html, body { margin: 0; height: 100%; background: #0B0D1A; overflow: hidden; color: var(--ink); font: 500 14px var(--body); }
  [hidden] { display: none !important; }
  .stagebox { position: fixed; inset: 0; }
  #stage { display: block; width: 100%; height: 100%; outline: none; touch-action: none; cursor: crosshair; }
  #noGL { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; font-size: 18px; }
  #map { display: none; }
  #mini { position: absolute; right: 14px; top: 62px; width: 200px; height: 136px; border-radius: 10px; border: 1px solid rgba(255,255,255,.14); pointer-events: none; background: #12152A; }
  .dot { position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: rgba(255,255,255,.8); box-shadow: 0 0 0 2px rgba(0,0,0,.4); pointer-events: none; }
  .tip { position: absolute; left: 50%; top: 64px; transform: translateX(-50%); z-index: 5; max-width: min(520px, 80%); background: rgba(22,24,30,.95); border: 1px solid rgba(255,255,255,.14); border-radius: 12px; padding: 10px 14px; text-align: center; pointer-events: none; }
  kbd { font: 600 13px var(--body); background: var(--raise2); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 6px; padding: 1px 7px; color: var(--ink); }
  .hud { position: absolute; left: 50%; bottom: 76px; transform: translateX(-50%); z-index: 4; display: grid; gap: 2px; text-align: center; padding: 10px 16px; border-radius: 14px; background: rgba(11,13,26,.86); border: 1px solid var(--line); max-width: min(620px, calc(100% - 24px)); pointer-events: none; }
  .hud b { font-size: 16px; } .hud span { color: var(--aqua); font: 600 15px var(--body); } .hud small { color: var(--ink2); font-size: 13px; }
  .prompt { position: absolute; left: 50%; top: 58%; transform: translateX(-50%); z-index: 4; font: 700 15px var(--body); padding: 8px 14px; border-radius: 999px; background: rgba(11,13,26,.86); border: 1px solid var(--aqua); pointer-events: none; }
  #playBtn { position: absolute; left: 50%; top: calc(58% + 44px); transform: translateX(-50%); z-index: 4; font: 700 15px var(--body); padding: 10px 18px; border-radius: 999px; border: 0; background: var(--glow); color: #0B0D1A; cursor: pointer; }
  @media (hover: hover) and (pointer: fine) { #playBtn { display: none; } }
  .scope { position: absolute; inset: 0; z-index: 3; pointer-events: none; background: radial-gradient(circle at 50% 50%, transparent 0 30%, #000 31%); }
  .chips { position: absolute; right: 14px; bottom: 14px; z-index: 4; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .chip { font: inherit; color: var(--ink); background: rgba(11,12,16,.74); border: 1px solid rgba(255,255,255,.14); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
  .chip:hover { background: rgba(38,41,50,.9); }
  .chip:focus-visible { outline: 3px solid var(--aqua); outline-offset: 2px; }
</style>
</head>
<body>
<div class="stagebox">
  <canvas id="stage" tabindex="0" aria-label="Harbor Lounge. W A S D to walk, the mouse to look, E to sit or play, Space to jump, C to crouch."></canvas>
  <div id="noGL" hidden>This browser couldn't start the 3D view. Try another browser, or ask the host to pick a different room.</div>
  <div class="dot"></div>
  <div class="tip" id="tip" hidden></div>
  <div class="scope" id="scope" hidden></div>
  <div class="prompt" id="prompt" hidden></div>
  <button id="playBtn" hidden>Play</button>
  <div class="hud" id="hud" hidden></div>
  <canvas id="mini" width="220" height="150" aria-label="Mini map showing where you are"></canvas>
  <canvas id="map" width="1216" height="1120"></canvas>
  <div class="chips" role="group" aria-label="Picture and sound">
    <button class="chip" id="look" aria-pressed="true">Look: Pretty</button>
    <button class="chip" id="snd" aria-pressed="true">Sound: On</button>
    <button class="chip" id="fs" aria-pressed="false">Full screen</button>
  </div>
</div>
<script src="vendor/three.min.js"></script>
<script src="vendor/three-extras.js"></script>
<script>
  // Wait for the lettering font first, so every sign in the Lounge is drawn with it
  (function () {
    var go = function () { if (go.done) return; go.done = true; var s = document.createElement("script"); s.src = "js/lounge.js"; document.body.appendChild(s); };
    try { Promise.all([document.fonts.load('800 20px "Glowfin Lexend"'), document.fonts.load('600 20px "Glowfin Lexend"')]).then(go, go); } catch (e) { go(); }
    setTimeout(go, 2500);
  })();
</script>
</body>
</html>
