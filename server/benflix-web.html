<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Benflix tools</title>
<!--
  Benflix tools in a PC browser. The games helper on Tower serves this page at http://<server>:8097.
  Sign in with a Jellyfin admin login. Tower tools go to /api/admin/..., Jellyfin requests to /api/web/jf/...
  Plain HTML + JavaScript, no downloads from the internet, so it works even when the internet is down.
-->
<style>
  :root {
    --bg: #141414; --panel: #1f1f1f; --panel2: #2a2a2a; --line: #333; --text: #f2f2f2; --dim: #a8a8a8;
    --red: #e50914; --red2: #b20710; --green: #46d369; --amber: #f5b301; --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button, input, select { font: inherit; color: inherit; }
  a { color: var(--text); }
  .hidden { display: none !important; }

  /* Sign in */
  #login { min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background: radial-gradient(circle at 30% 20%, #3a0a0d 0, var(--bg) 60%); }
  .card { background: rgba(0,0,0,.75); border-radius: var(--radius); padding: 32px 28px; width: 100%; max-width: 380px; }
  .logo { color: var(--red); font-weight: 900; letter-spacing: .04em; font-size: 30px; text-transform: uppercase; }
  .card h1 { font-size: 22px; margin: 18px 0 6px; }
  .card p { color: var(--dim); margin: 0 0 18px; }
  .field { display: block; width: 100%; padding: 12px 14px; margin-bottom: 12px; border-radius: 6px; border: 1px solid #444; background: #333; }
  .field:focus { outline: 2px solid #fff; outline-offset: 0; }
  .btn { border: 0; border-radius: 6px; padding: 10px 16px; background: var(--panel2); cursor: pointer; font-weight: 600; white-space: nowrap; }
  .btn:hover { background: #3a3a3a; }
  .btn:focus-visible { outline: 2px solid #fff; }
  .btn.red { background: var(--red); }
  .btn.red:hover { background: var(--red2); }
  .btn.small { padding: 6px 12px; font-size: 14px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .wide { width: 100%; padding: 12px; }
  .err { color: #ff8a8a; min-height: 1.4em; margin-top: 10px; }

  /* Main page */
  header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 16px; padding: 12px 24px;
    background: linear-gradient(#000, rgba(0,0,0,.85)); border-bottom: 1px solid #222; }
  header .logo { font-size: 24px; }
  header .who { margin-left: auto; color: var(--dim); font-size: 14px; display: flex; gap: 12px; align-items: center; }
  .layout { display: grid; grid-template-columns: 210px 1fr; min-height: calc(100vh - 57px); }
  nav { border-right: 1px solid #222; padding: 16px 10px; display: flex; flex-direction: column; gap: 4px; }
  nav button { text-align: left; border: 0; background: none; padding: 10px 14px; border-radius: 8px; cursor: pointer; color: var(--dim); font-weight: 600; }
  nav button:hover { background: var(--panel); color: var(--text); }
  nav button.on { background: var(--panel2); color: var(--text); box-shadow: inset 3px 0 0 var(--red); }
  main { padding: 24px; max-width: 1100px; width: 100%; }
  h2 { margin: 0 0 4px; font-size: 24px; }
  .sub { color: var(--dim); margin: 0 0 20px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .tile { background: var(--panel); border-radius: var(--radius); padding: 14px 16px; }
  .tile .k { color: var(--dim); font-size: 13px; }
  .tile .v { font-size: 26px; font-weight: 700; margin-top: 2px; }
  .bar { height: 6px; background: #333; border-radius: 3px; margin-top: 8px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--green); border-radius: 3px; }
  .bar i.warn { background: var(--amber); }
  .bar i.bad { background: var(--red); }
  .list { background: var(--panel); border-radius: var(--radius); overflow: hidden; margin-bottom: 24px; }
  .item { display: flex; gap: 14px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line); }
  .item:first-child { border-top: 0; }
  .item .grow { flex: 1; min-width: 0; }
  .item .t { font-weight: 600; overflow-wrap: anywhere; }
  .item .s { color: var(--dim); font-size: 14px; overflow-wrap: anywhere; }
  .item .acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--green); }
  .dot.bad { background: var(--red); }
  .dot.warn { background: var(--amber); }
  .dot.off { background: #666; }
  .empty { padding: 18px 16px; color: var(--dim); }
  .note { background: #2b2410; border: 1px solid #5a4a12; color: #f3dc94; border-radius: var(--radius); padding: 12px 16px; margin-bottom: 16px; }
  .section-title { font-size: 17px; margin: 0 0 10px; }
  pre.log { background: #0b0b0b; border: 1px solid #222; border-radius: var(--radius); padding: 12px 14px; max-height: 420px; overflow: auto;
    white-space: pre-wrap; overflow-wrap: anywhere; font: 13px/1.5 ui-monospace, Consolas, monospace; color: #cfcfcf; margin: 0; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #fff; color: #000; padding: 12px 18px;
    border-radius: 8px; font-weight: 600; max-width: calc(100% - 32px); box-shadow: 0 6px 24px rgba(0,0,0,.5); z-index: 20; }
  select.field { width: auto; min-width: 220px; margin: 0; }
  input.field.inline { width: auto; flex: 1; min-width: 180px; margin: 0; }

  /* Phones and small windows: menu becomes a row of tabs */
  @media (max-width: 760px) {
    header { padding: 10px 16px; }
    header .who span { display: none; }
    .layout { grid-template-columns: 1fr; align-content: start; }
    nav { flex-direction: row; align-items: center; overflow-x: auto; border-right: 0; border-bottom: 1px solid #222; padding: 8px 12px; position: sticky; top: 53px; background: var(--bg); z-index: 4; }
    nav button { white-space: nowrap; padding: 8px 12px; }
    nav button.on { box-shadow: inset 0 -3px 0 var(--red); }
    main { padding: 16px; }
    .item { flex-wrap: wrap; }
    .item .acts { width: 100%; justify-content: flex-start; padding-left: 24px; }
    select.field { width: 100%; }
  }
</style>
</head>
<body>

<section id="login" class="hidden">
  <form class="card" id="loginForm" autocomplete="on">
    <div class="logo">Benflix</div>
    <h1>Benflix tools</h1>
    <p>Sign in with your Jellyfin admin login.</p>
    <input class="field" id="user" name="username" placeholder="User name" autocomplete="username" required>
    <input class="field" id="pass" name="password" type="password" placeholder="Password" autocomplete="current-password">
    <button class="btn red wide" type="submit" id="loginBtn">Sign in</button>
    <div class="err" id="loginErr"></div>
  </form>
</section>

<section id="app" class="hidden">
  <header>
    <div class="logo">Benflix</div>
    <div class="who"><span id="whoName"></span><button class="btn small" id="logout">Sign out</button></div>
  </header>
  <div class="layout">
    <nav id="nav"></nav>
    <main id="main"></main>
  </div>
</section>

<div id="toast" class="hidden"></div>

<script>
"use strict";
const SECTIONS = [
  { id: "overview", label: "Overview" },
  { id: "apps", label: "Apps" },
  { id: "downloads", label: "Downloads" },
  { id: "find", label: "Find copies" },
  { id: "tracks", label: "Track tidy" },
];

// ---------- small helpers ----------
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function store(k, v) { try { v === undefined ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
let toastTimer;
function toast(text) {
  const t = $("#toast"); t.textContent = text; t.classList.remove("hidden");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.add("hidden"), 5000);
}

let session = null; // { token, name, id }
try { session = JSON.parse(load("benflix_web") || "null"); } catch (e) {}

async function call(method, path, body) {
  const headers = { "Accept": "application/json" };
  if (session) headers["X-Benflix-Token"] = session.token;
  if (body !== undefined) headers["Content-Type"] = "application/json";
  let r;
  try {
    r = await fetch(path, { method, headers, body: body === undefined ? undefined : JSON.stringify(body) });
  } catch (e) {
    throw new Error("Couldn't reach the Benflix helper on Tower. Is Tower on?");
  }
  const text = await r.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch (e) {}
  if (r.status === 401 && session) { signOut(true); throw new Error("Please sign in again."); }
  if (!r.ok) throw new Error((data && (data.error || data.message)) || `Something went wrong (${r.status}).`);
  return data;
}
const tower = (fresh) => call("GET", "/api/admin/tower" + (fresh ? "?fresh=1" : ""));
const jf = (method, path, body) => call(method, "/api/web/jf" + path, body);

function pct(v) { return v == null ? "–" : v + "%"; }
function barClass(v) { return v >= 90 ? "bad" : v >= 75 ? "warn" : ""; }
function bytes(n) {
  if (n == null) return "–";
  const u = ["B", "KB", "MB", "GB", "TB", "PB"]; let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return (n >= 100 || i === 0 ? Math.round(n) : n.toFixed(1)) + " " + u[i];
}
function upTime(s) {
  if (s == null) return "–";
  const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60);
  return d ? `${d} day${d === 1 ? "" : "s"}, ${h} h` : h ? `${h} h ${m} min` : `${m} min`;
}
function tile(k, v, barValue) {
  const bar = barValue == null ? "" : `<div class="bar"><i class="${barClass(barValue)}" style="width:${Math.min(100, barValue)}%"></i></div>`;
  return `<div class="tile"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div>${bar}</div>`;
}
function problemsNote(list) {
  return (list || []).map((p) => `<div class="note">${esc(p)}</div>`).join("");
}
function loading(text) { return `<div class="list"><div class="empty">${esc(text || "Loading…")}</div></div>`; }

// ---------- sign in / out ----------
function showLogin() { $("#app").classList.add("hidden"); $("#login").classList.remove("hidden"); $("#user").focus(); }
function showApp() {
  $("#login").classList.add("hidden"); $("#app").classList.remove("hidden");
  $("#whoName").textContent = "Signed in as " + session.name;
  buildNav(); go(location.hash.slice(1) || "overview");
}
function deviceId() {
  let d = load("benflix_web_device");
  if (!d) { d = Math.random().toString(36).slice(2, 12); store("benflix_web_device", d); }
  return d;
}
$("#loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("#loginErr").textContent = ""; $("#loginBtn").disabled = true; $("#loginBtn").textContent = "Signing in…";
  try {
    session = await call("POST", "/api/web/login", { username: $("#user").value, password: $("#pass").value, device: deviceId() });
    store("benflix_web", JSON.stringify(session));
    $("#pass").value = "";
    showApp();
  } catch (err) {
    $("#loginErr").textContent = err.message;
  } finally {
    $("#loginBtn").disabled = false; $("#loginBtn").textContent = "Sign in";
  }
});
async function signOut(quiet) {
  const s = session; session = null; store("benflix_web");
  if (s && !quiet) {
    try { await fetch("/api/web/jf/Sessions/Logout", { method: "POST", headers: { "X-Benflix-Token": s.token } }); } catch (e) {}
  }
  stopTimers(); showLogin();
}
$("#logout").addEventListener("click", () => signOut(false));

// ---------- menu ----------
let current = null, timers = [];
function stopTimers() { timers.forEach(clearInterval); timers = []; }
function every(ms, fn) { timers.push(setInterval(fn, ms)); }
function buildNav() {
  $("#nav").innerHTML = SECTIONS.map((s) => `<button data-id="${s.id}">${esc(s.label)}</button>`).join("");
  $("#nav").onclick = (e) => { const b = e.target.closest("button"); if (b) go(b.dataset.id); };
}
function go(id) {
  if (!SECTIONS.some((s) => s.id === id)) id = "overview";
  current = id; stopTimers();
  if (location.hash !== "#" + id) history.replaceState(null, "", "#" + id);
  document.querySelectorAll("#nav button").forEach((b) => b.classList.toggle("on", b.dataset.id === id));
  const main = $("#main"); main.innerHTML = "";
  PAGES[id](main);
}
window.addEventListener("hashchange", () => { if (session) go(location.hash.slice(1)); });

// ---------- pages ----------
const PAGES = {};

PAGES.overview = (el) => {
  el.innerHTML = `<h2>Overview</h2><p class="sub">How Tower is doing. Updates by itself every 20 seconds.</p><div id="ov">${loading()}</div>`;
  const draw = async (fresh) => {
    try {
      const t = await tower(fresh);
      if (current !== "overview") return;
      const apps = t.apps || [];
      const down = apps.filter((a) => !a.ok);
      const stuck = (t.downloads || []).filter((d) => d.stuck);
      let html = problemsNote(t.problems);
      html += `<div class="tiles">
        ${tile("Processor", pct(t.cpu), t.cpu)}
        ${tile("Memory", pct(t.memory), t.memory)}
        ${tile("Graphics chip", pct(t.gpu), t.gpu)}
        ${tile("Up for", upTime(t.up_seconds))}
        ${(t.disks || []).map((d) => { const used = Math.round(100 * d.used / (d.used + d.free)); return tile(d.name + " free", bytes(d.free), used); }).join("")}
      </div>`;
      html += `<h3 class="section-title">Needs you</h3><div class="list">`;
      const needs = [];
      down.forEach((a) => needs.push(`<div class="item"><span class="dot bad"></span><div class="grow"><div class="t">${esc(a.nice)}</div><div class="s">${esc(a.status)}</div></div><div class="acts"><button class="btn small" data-go="apps">Open Apps</button></div></div>`));
      stuck.forEach((d) => needs.push(`<div class="item"><span class="dot warn"></span><div class="grow"><div class="t">${esc(d.title)}</div><div class="s">${esc(d.why || "Stuck")}</div></div><div class="acts"><button class="btn small" data-go="downloads">Open Downloads</button></div></div>`));
      html += needs.join("") || `<div class="empty">Nothing needs you right now. 🎉</div>`;
      html += `</div>`;
      const running = (t.downloads || []).filter((d) => !d.stuck).length;
      html += `<div class="tiles">${tile("Apps running", `${apps.filter((a) => a.running).length} of ${apps.length}`)}${tile("Downloading", running)}${tile("Stuck downloads", stuck.length)}</div>`;
      $("#ov").innerHTML = html;
      $("#ov").onclick = (e) => { const b = e.target.closest("[data-go]"); if (b) go(b.dataset.go); };
    } catch (err) {
      if (current === "overview") $("#ov").innerHTML = `<div class="note">${esc(err.message)}</div>`;
    }
  };
  draw(true); every(20000, () => draw(false));
};

PAGES.apps = (el) => {
  el.innerHTML = `<h2>Apps</h2><p class="sub">Everything running in Unraid's Docker tab. Restart one if it's acting up.</p><div id="ap">${loading()}</div>`;
  const draw = async (fresh) => {
    try {
      const t = await tower(fresh);
      if (current !== "apps") return;
      let html = problemsNote(t.problems);
      if (!t.apps) { $("#ap").innerHTML = html || loading("No apps found."); return; }
      html += `<div class="list">` + t.apps.map((a) => `
        <div class="item"><span class="dot ${a.ok ? "" : a.running ? "warn" : "bad"}"></span>
          <div class="grow"><div class="t">${esc(a.nice)}</div><div class="s">${esc(a.status)}</div></div>
          <div class="acts">${a.restartable ? `<button class="btn small" data-restart="${esc(a.name)}" data-nice="${esc(a.nice)}">Restart</button>` : ""}</div>
        </div>`).join("") + `</div>`;
      $("#ap").innerHTML = html;
    } catch (err) { if (current === "apps") $("#ap").innerHTML = `<div class="note">${esc(err.message)}</div>`; }
  };
  el.onclick = async (e) => {
    const b = e.target.closest("[data-restart]"); if (!b) return;
    if (!confirm(`Restart ${b.dataset.nice}? Anyone using it will be cut off for about a minute.`)) return;
    b.disabled = true; b.textContent = "Restarting…";
    try { toast((await call("POST", `/api/admin/apps/${encodeURIComponent(b.dataset.restart)}/restart`)).message); }
    catch (err) { toast(err.message); }
    draw(true);
  };
  draw(true); every(20000, () => draw(false));
};

PAGES.downloads = (el) => {
  el.innerHTML = `<h2>Downloads</h2><p class="sub">What Sonarr and Radarr are getting. Stuck ones are at the top.</p><div id="dl">${loading()}</div>`;
  const draw = async (fresh) => {
    try {
      const t = await tower(fresh);
      if (current !== "downloads") return;
      let html = problemsNote(t.problems);
      if (!t.sonarr && !t.radarr) html += `<div class="note">Sonarr and Radarr aren't connected to the helper yet. Run the Benflix setup command on Tower again.</div>`;
      const list = t.downloads || [];
      html += `<div class="list">` + (list.map((d) => `
        <div class="item"><span class="dot ${d.stuck ? "bad" : d.paused || d.queued ? "off" : ""}"></span>
          <div class="grow"><div class="t">${esc(d.title)}</div>
            <div class="s">${d.stuck ? esc(d.why || "Stuck") : d.paused ? "Paused" : d.queued ? "Waiting to start" : `${d.pct}%${d.left ? " · " + esc(d.left) + " left" : ""}`} · ${d.app === "sonarr" ? "Sonarr" : "Radarr"}</div>
            ${d.stuck ? "" : `<div class="bar"><i style="width:${d.pct}%"></i></div>`}
          </div>
          <div class="acts">
            <button class="btn small" data-act="retry" data-app="${d.app}" data-id="${d.id}">Try again</button>
            <button class="btn small" data-act="replace" data-app="${d.app}" data-id="${d.id}" data-title="${esc(d.title)}">Get a different copy</button>
          </div>
        </div>`).join("") || `<div class="empty">Nothing downloading right now.</div>`) + `</div>`;
      $("#dl").innerHTML = html;
    } catch (err) { if (current === "downloads") $("#dl").innerHTML = `<div class="note">${esc(err.message)}</div>`; }
  };
  el.onclick = async (e) => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    if (b.dataset.act === "replace" && !confirm(`Remove this download of ${b.dataset.title} and look for a different copy?`)) return;
    b.disabled = true;
    try { toast((await call("POST", `/api/admin/downloads/${b.dataset.app}/${b.dataset.id}/${b.dataset.act}`)).message); }
    catch (err) { toast(err.message); }
    draw(true);
  };
  draw(true); every(15000, () => draw(true));
};

PAGES.find = (el) => {
  el.innerHTML = `<h2>Find copies</h2>
    <p class="sub">Search your library. For a show, Sonarr looks for every missing episode. For a movie, Radarr looks for a better copy.</p>
    <form class="row" id="fForm" style="margin-bottom:16px">
      <input class="field inline" id="fText" placeholder="Show or movie name" autocomplete="off">
      <button class="btn red" type="submit">Search</button>
    </form>
    <div id="fRes"></div>`;
  $("#fText").focus();
  $("#fForm").onsubmit = async (e) => {
    e.preventDefault();
    const q = $("#fText").value.trim(); if (!q) return;
    $("#fRes").innerHTML = loading("Searching…");
    try {
      const r = await jf("GET", `/Items?userId=${encodeURIComponent(session.id)}&searchTerm=${encodeURIComponent(q)}&IncludeItemTypes=Series,Movie&Recursive=true&Fields=ProviderIds&Limit=20`);
      const items = (r && r.Items) || [];
      $("#fRes").innerHTML = `<div class="list">` + (items.map((it, i) => `
        <div class="item"><div class="grow"><div class="t">${esc(it.Name)}${it.ProductionYear ? ` (${it.ProductionYear})` : ""}</div>
          <div class="s">${it.Type === "Series" ? "Show" : "Movie"}</div></div>
          <div class="acts"><button class="btn small" data-i="${i}">${it.Type === "Series" ? "Find missing episodes" : "Find a better copy"}</button></div>
        </div>`).join("") || `<div class="empty">Nothing in your library matches “${esc(q)}”.</div>`) + `</div>`;
      $("#fRes").onclick = async (ev) => {
        const b = ev.target.closest("[data-i]"); if (!b) return;
        const it = items[+b.dataset.i], ids = it.ProviderIds || {};
        const info = { name: it.Name, tmdb: ids.Tmdb || ids.tmdb, tvdb: ids.Tvdb || ids.tvdb, imdb: ids.Imdb || ids.imdb };
        b.disabled = true;
        try { toast((await call("POST", it.Type === "Series" ? "/api/admin/search/missing" : "/api/admin/search/better", info)).message); }
        catch (err) { toast(err.message); }
        b.disabled = false;
      };
    } catch (err) { $("#fRes").innerHTML = `<div class="note">${esc(err.message)}</div>`; }
  };
};

PAGES.tracks = (el) => {
  el.innerHTML = `<h2>Track tidy</h2>
    <p class="sub">Gives audio and subtitle tracks clear names (like “English · 5.1”) without re-encoding anything.
    Try <b>Preview</b> first: it only shows what it would change.</p><div id="tr">${loading()}</div>`;
  let picked = load("benflix_web_folder") || "";
  const draw = async () => {
    try {
      const s = await call("GET", "/api/admin/tracks");
      if (current !== "tracks") return;
      if (!s.ready) { $("#tr").innerHTML = `<div class="note">${esc(s.problem)}</div>`; return; }
      if (!s.folders.includes(picked)) picked = s.folders[0] || "";
      const state = s.running ? `Running: ${esc(s.mode)} on ${esc(s.folder)}…`
        : s.finished ? `Last run: ${esc(s.mode)} on ${esc(s.folder)} ${s.result === "done" ? "finished" : "had a problem"} at ${new Date(s.finished * 1000).toLocaleTimeString()}.`
        : "Not run yet since the helper started.";
      const keepFocus = document.activeElement && document.activeElement.id;
      $("#tr").innerHTML = `
        <div class="list"><div class="item" style="flex-wrap:wrap">
          <div class="grow" style="min-width:200px"><div class="t">Folder</div>
            <select class="field" id="trFolder" ${s.running ? "disabled" : ""}>${s.folders.map((f) => `<option ${f === picked ? "selected" : ""}>${esc(f)}</option>`).join("")}</select></div>
          <div class="acts">
            <button class="btn small" data-mode="preview" ${s.running ? "disabled" : ""}>Preview</button>
            <button class="btn small red" data-mode="apply" ${s.running ? "disabled" : ""}>Fix names</button>
          </div>
        </div>
        ${(s.undo_files || []).length ? `<div class="item"><div class="grow"><div class="t">Undo a past fix</div><div class="s">Puts the old names back.</div></div>
          <div class="acts">${s.undo_files.map((u) => `<button class="btn small" data-undo="${esc(u)}" ${s.running ? "disabled" : ""}>${esc(u.replace(/^undo-|\.json$/g, ""))}</button>`).join("")}</div></div>` : ""}
        </div>
        <p class="sub" style="margin-bottom:10px">${state}</p>
        <pre class="log">${s.lines.length ? s.lines.map(esc).join("\n") : "What the tool does will show here."}</pre>`;
      const log = $("#tr pre.log"); log.scrollTop = log.scrollHeight;
      $("#trFolder").onchange = (e) => { picked = e.target.value; store("benflix_web_folder", picked); };
      if (keepFocus === "trFolder") $("#trFolder").focus();
    } catch (err) { if (current === "tracks") $("#tr").innerHTML = `<div class="note">${esc(err.message)}</div>`; }
  };
  el.onclick = async (e) => {
    const b = e.target.closest("[data-mode],[data-undo]"); if (!b) return;
    let body;
    if (b.dataset.undo) {
      if (!confirm("Put back the old track names from that fix?")) return;
      body = { mode: "undo", undo: b.dataset.undo };
    } else {
      if (b.dataset.mode === "apply" && !confirm(`Fix the track names in ${picked}? You can undo it afterwards.`)) return;
      body = { mode: b.dataset.mode, folder: picked };
    }
    try { await call("POST", "/api/admin/tracks", body); } catch (err) { toast(err.message); }
    draw();
  };
  draw(); every(2000, () => { if (document.activeElement?.id !== "trFolder") draw(); });
};

// ---------- start ----------
if (session && session.token) showApp(); else showLogin();
</script>
</body>
</html>
